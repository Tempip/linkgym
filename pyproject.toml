[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "linkgym"
version = "0.0.1"
description = "Gymnasium environments for 5G NR link adaptation (MCS selection) built on NVIDIA Sionna SYS."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pedro Rodrigues" }]
requires-python = ">=3.11"
dependencies = [
    "sionna-no-rt>=2.1,<2.2",
    "gymnasium>=1.0,<2",
    "numpy",
]

[project.optional-dependencies]
train = ["stable-baselines3>=2.3,<3", "tensorboard"]
dev = ["pytest", "ruff==0.16.9", "pre-commit"]

[project.urls]
Homepage = "https://github.com/Tempip/linkgym"
Repository = "https://github.com/Tempip/linkgym"
Issues = "https://github.com/Tempip/linkgym/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/linkgym"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "NPY", # numpy-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["linkgym"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running tests, skipped in CI"]
